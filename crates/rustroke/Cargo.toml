[package]
name = "rustroke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
authors.workspace = true
description = "An immediate-mode GUI library for Rust with its own wgpu renderer."

[lints]
workspace = true

[dependencies]
rustroke-core.workspace = true
rustroke-winit.workspace = true
rustroke-text.workspace = true
rustroke-widgets.workspace = true
image = { workspace = true, optional = true }

[features]
default = ["image"]
## Load PNG and JPEG files with `rustroke::load_image`.
image = ["dep:image"]

[dev-dependencies]
env_logger.workspace = true
log.workspace = true
# Native file dialogs, only for the `files` example.
rfd = "0.17"
# Blocking on wgpu setup in the `integration` example.
pollster.workspace = true
