[package]
name = "rustroke-winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
description = "Desktop integration: window, event loop and input with winit."

[lints]
workspace = true

[dependencies]
winit.workspace = true
accesskit.workspace = true
log.workspace = true
web-time = "1"
wgpu.workspace = true
png.workspace = true
rustroke-core.workspace = true
rustroke-render.workspace = true
rustroke-soft.workspace = true
rustroke-text.workspace = true
rustroke-widgets.workspace = true
serde_json = { workspace = true, optional = true }

# The desktop: system clipboard, screen readers, blocking GPU setup.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
arboard.workspace = true
accesskit_winit.workspace = true

# The browser: async GPU setup on WebGPU, or WebGL 2 where it is missing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CssStyleDeclaration", "HtmlElement", "console"] }

# Native menu bar (macOS) and tray icon (macOS, Windows); tray-icon
# re-exports the `muda` menus.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }

[features]
## Save UI state, the window's position and size, and app values between
## runs (see `WindowOptions::persistence_id`).
persistence = ["rustroke-widgets/persistence", "dep:serde_json"]
## The macOS menu bar from `Frame::set_native_menu` (no effect elsewhere).
## Needs Rust 1.90 (tray-icon/muda).
native-menu = ["dep:tray-icon"]
## An icon in the system tray / menu bar extras (macOS, Windows).
## Needs Rust 1.90 (tray-icon/muda).
tray = ["dep:tray-icon"]

[package.metadata.docs.rs]
all-features = true
